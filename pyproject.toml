[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-dev-stack-cli"
version = "1.0.0"
description = "Guided command-line administration for Pi Dev Stack"
requires-python = ">=3.11"
dependencies = [
  "typer==0.16.1",
  "rich==14.1.0",
  "PyYAML==6.0.2",
]

[project.scripts]
homelab = "homelab_cli.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.setuptools]
packages = ["homelab_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
