services:
  postgres:
    image: postgres:16-alpine
    container_name: pi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnet

  redis:
    image: redis:7-alpine
    container_name: pi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - devnet

  n8n:
    image: n8nio/n8n:latest
    container_name: pi-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-dev}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-Australia/Melbourne}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_this_32_char_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - devnet

  ollama:
    image: ollama/ollama:latest
    container_name: pi-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - devnet

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: pi-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change_this_webui_secret}
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - devnet

  portainer:
    image: portainer/portainer-ce:latest
    container_name: pi-portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - devnet

  dozzle:
    image: amir20/dozzle:latest
    container_name: pi-dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: pi-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - devnet

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: pi-homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:3000"
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet

  glances:
    image: nicolargo/glances:latest-full
    container_name: pi-glances
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:61208:61208"
    environment:
      GLANCES_OPT: -w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: pi-home-assistant
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./data/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    privileged: true
    networks:
      - devnet

  pihole:
    image: pihole/pihole:latest
    container_name: pi-pihole
    restart: unless-stopped
    hostname: ${PIHOLE_HOSTNAME:-pi-hole}
    ports:
      - "${PIHOLE_DNS_BIND:-0.0.0.0}:53:53/tcp"
      - "${PIHOLE_DNS_BIND:-0.0.0.0}:53:53/udp"
      - "${PIHOLE_WEB_BIND:-127.0.0.1}:8081:80/tcp"
    environment:
      TZ: ${TIMEZONE:-Australia/Melbourne}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD:-change_this_pihole_password}
      FTLCONF_dns_listeningMode: ${PIHOLE_DNS_LISTENING_MODE:-all}
      FTLCONF_dns_upstreams: ${PIHOLE_DNS_UPSTREAMS:-1.1.1.1;1.0.0.1}
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
      - ./data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    networks:
      - devnet

  watchtower:
    image: containrrr/watchtower:latest
    container_name: pi-watchtower
    restart: unless-stopped
    profiles: ["extras"]
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devnet

  traefik:
    image: traefik:v3.1
    container_name: pi-traefik
    restart: unless-stopped
    profiles: ["extras"]
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "127.0.0.1:8082:8080"
      - "${TRAEFIK_HTTP_BIND:-127.0.0.1}:8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik:/data
    networks:
      - devnet

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: pi-vaultwarden
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:8083:80"
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:-http://localhost:8083}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-change_this_vaultwarden_admin_token}
    volumes:
      - ./data/vaultwarden:/data
    networks:
      - devnet

  gitea:
    image: gitea/gitea:latest-rootless
    container_name: pi-gitea
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:3002:3000"
      - "127.0.0.1:2222:2222"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3002/}
      GITEA__server__SSH_PORT: 2222
    volumes:
      - ./data/gitea:/var/lib/gitea
      - ./data/gitea-config:/etc/gitea
    networks:
      - devnet

  minio:
    image: minio/minio:latest
    container_name: pi-minio
    restart: unless-stopped
    profiles: ["extras"]
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
    volumes:
      - ./data/minio:/data
    networks:
      - devnet

  syncthing:
    image: syncthing/syncthing:latest
    container_name: pi-syncthing
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ./data/syncthing:/var/syncthing
    networks:
      - devnet

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: pi-filebrowser
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - ./data/filebrowser/database:/database
      - ./data/filebrowser/config:/config
      - ./data:/srv/data
      - ./local:/srv/local
    networks:
      - devnet

  netdata:
    image: netdata/netdata:stable
    container_name: pi-netdata
    restart: unless-stopped
    profiles: ["extras"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    ports:
      - "127.0.0.1:19999:19999"
    volumes:
      - ./data/netdata/config:/etc/netdata
      - ./data/netdata/lib:/var/lib/netdata
      - ./data/netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet

  prometheus:
    image: prom/prometheus:latest
    container_name: pi-prometheus
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    networks:
      - devnet

  grafana:
    image: grafana/grafana-oss:latest
    container_name: pi-grafana
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_this_grafana_password}
    volumes:
      - ./data/grafana:/var/lib/grafana
    networks:
      - devnet

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pi-mosquitto
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - devnet

  nodered:
    image: nodered/node-red:latest
    container_name: pi-nodered
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      TZ: ${TIMEZONE:-Australia/Melbourne}
    volumes:
      - ./data/nodered:/data
    networks:
      - devnet

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: pi-code-server
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE:-Australia/Melbourne}
      PASSWORD: ${CODE_SERVER_PASSWORD:-change_this_code_server_password}
      DEFAULT_WORKSPACE: /workspace
    volumes:
      - ./data/code-server:/config
      - ./:/workspace
    networks:
      - devnet

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: pi-plex
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "${PLEX_WEB_BIND:-127.0.0.1}:32400:32400"
      - "${PLEX_WEB_BIND:-127.0.0.1}:1900:1900/udp"
      - "${PLEX_WEB_BIND:-127.0.0.1}:3005:3005"
      - "${PLEX_WEB_BIND:-127.0.0.1}:5353:5353/udp"
      - "${PLEX_WEB_BIND:-127.0.0.1}:8324:8324"
      - "${PLEX_WEB_BIND:-127.0.0.1}:32410:32410/udp"
      - "${PLEX_WEB_BIND:-127.0.0.1}:32412:32412/udp"
      - "${PLEX_WEB_BIND:-127.0.0.1}:32413:32413/udp"
      - "${PLEX_WEB_BIND:-127.0.0.1}:32414:32414/udp"
      - "${PLEX_WEB_BIND:-127.0.0.1}:32469:32469"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TIMEZONE:-Australia/Melbourne}
      PLEX_CLAIM: ${PLEX_CLAIM:-}
      VERSION: docker
    volumes:
      - ./data/plex/config:/config
      - ./media:/media
    networks:
      - devnet

  dockge:
    image: louislam/dockge:latest
    container_name: pi-dockge
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "${DOCKGE_WEB_BIND:-127.0.0.1}:5001:5001"
    environment:
      DOCKGE_STACKS_DIR: /compose/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dockge:/app/data
      - ./data/dockge/stacks:/compose/stacks
      - ./:/compose/stacks/pi-dev-stack
    networks:
      - devnet

networks:
  devnet:
    name: pi-dev-stack
