services:
  postgres:
    image: postgres:16-alpine
    container_name: pi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devnet

  redis:
    image: redis:7-alpine
    container_name: pi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - devnet

  n8n:
    image: n8nio/n8n:latest
    container_name: pi-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-dev}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-Australia/Melbourne}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change_this_32_char_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - devnet

  ollama:
    image: ollama/ollama:latest
    container_name: pi-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - devnet

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: pi-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change_this_webui_secret}
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - devnet

  portainer:
    image: portainer/portainer-ce:latest
    container_name: pi-portainer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - devnet

  dozzle:
    image: amir20/dozzle:latest
    container_name: pi-dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: pi-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - devnet

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: pi-homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:3000"
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet

  glances:
    image: nicolargo/glances:latest-full
    container_name: pi-glances
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:61208:61208"
    environment:
      GLANCES_OPT: -w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devnet

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: pi-home-assistant
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./data/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    privileged: true
    networks:
      - devnet

networks:
  devnet:
    name: pi-dev-stack
