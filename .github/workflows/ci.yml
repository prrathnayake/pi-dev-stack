name: Validate Pi Dev Stack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CLI and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check homelab_cli tests
      - name: Test
        run: pytest -q
      - name: Validate launcher
        run: sh -n homelab
      - name: Smoke test commands
        run: |
          python -m homelab_cli --help
          python -m homelab_cli --json service list
          python -m homelab_cli --dry-run setup

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create test environment
        run: cp .env.example .env
      - name: Validate all Compose profiles
        run: docker compose --profile extras config

  smoke-test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: cp .env.example .env
      - run: mkdir -p data/postgres data/redis
      - run: docker compose up -d postgres redis
      - name: Verify PostgreSQL and Redis
        run: |
          for i in {1..30}; do docker exec pi-postgres pg_isready -U dev -d n8n && break; sleep 2; done
          docker exec pi-postgres pg_isready -U dev -d n8n
          docker exec pi-redis redis-cli ping | grep PONG
          python -m homelab_cli stack status --profile core
      - if: always()
        run: docker compose down -v --remove-orphans
