name: Validate Pi Dev Stack

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config

      - name: Validate bash scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck homelab || true
          for f in lib/*.sh commands/*.sh; do shellcheck "$f" || true; done

      - name: Validate TUI Python syntax
        run: |
          python3 -m py_compile tui/__main__.py
          python3 -m py_compile tui/app.py
          python3 -m py_compile tui/data.py
          python3 -m py_compile tui/theme.py
          for f in tui/components/*.py; do python3 -m py_compile "$f"; done

      - name: Validate executable permissions
        run: |
          test -x homelab || chmod +x homelab

      - name: Smoke test CLI
        run: |
          ./homelab help
          ./homelab service list
          ./homelab n8n url
          ./homelab pihole url

      - name: Validate ignored local paths
        run: |
          grep 'local/' .gitignore
          grep 'data/' .gitignore
          grep 'backups/' .gitignore
